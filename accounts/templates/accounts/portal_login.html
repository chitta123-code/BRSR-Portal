<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>BRSR / ESG Portal Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #0f172a,
                #1e3a5f,
                #0f766e
            );
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            border: none;
            border-radius: 18px;
            overflow: hidden;
        }

        .portal-header {
            background: #111827;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .portal-logo {
            width: 65px;
            height: 65px;
            margin: auto;
            border-radius: 50%;
            background: #0d9488;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        .footer-text {
            font-size: 13px;
            color: #6c757d;
        }

        .login-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
        }

    </style>

</head>


<body>


<div class="card shadow-lg login-card">


    <!-- HEADER -->

    <div class="portal-header">

        <div class="portal-logo">
            ESG
        </div>

        <h3 class="mt-3 mb-1">
            BRSR / ESG Portal
        </h3>

        <p class="mb-0 text-white-50">
            ESG Data Management & BRSR Reporting
        </p>

    </div>


    <!-- LOGIN -->

    <div class="card-body p-4">


        <div class="mb-4">

            <h5 class="mb-1">
                Welcome
            </h5>

            <small class="text-muted">
                Sign in to continue
            </small>

        </div>


        <!-- ERROR MESSAGE -->

        {% if form.errors %}

        <div class="alert alert-danger">

            Invalid username or password.

        </div>

        {% endif %}


        {% if error_message %}

        <div class="alert alert-danger">

            {{ error_message }}

        </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form
            method="post"
            action="{% url 'login' %}">

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="mb-3">

                <label
                    for="username"
                    class="form-label">

                    Username

                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                    autofocus>

            </div>


            <!-- PASSWORD -->

            <div class="mb-3">

                <label
                    for="password"
                    class="form-label">

                    Password

                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required>

            </div>


            <!-- NEXT URL -->

            <input
                type="hidden"
                name="next"
                value="{{ next }}">


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="btn btn-primary w-100 py-2">

                Login

            </button>


        </form>


        <div class="login-info text-center mt-4">

            🔐 Secure role-based ESG data management

        </div>


        <div class="text-center mt-3">

            <p class="footer-text mb-0">

                Authorized users only

            </p>

        </div>


    </div>


</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
